<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<title>Conoce a tu equipo · Plantilla Advance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="plantillas.css">
<style>#lienzo{background:var(--advance-tinta);color:#fff}.marca-ejemplo{position:absolute;top:28px;right:28px;padding:10px 18px;border:2px dashed currentColor;border-radius:999px;font-size:22px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9}.marca-ejemplo{color:var(--advance-ambar)}</style>
</head>
<body>
<!-- Reemplaza nombre, profesión, días y la foto (con consentimiento escrito). Borra el rótulo «Ejemplo» antes de exportar. -->
<main class="lienzo cuadrado" id="lienzo">

  <div class="marca-ejemplo">Ejemplo · editar antes de publicar</div>
  <div style="position:absolute;left:80px;top:90px" class="kicker"><span style="color:var(--advance-agua)">● Conoce a tu equipo</span></div>
  <div style="position:absolute;left:80px;top:190px;width:340px;height:340px;border-radius:50%;border:5px dashed var(--advance-agua);display:grid;place-items:center;text-align:center;color:var(--advance-agua);font-size:28px;font-weight:600;padding:40px">Foto real del profesional</div>
  <div style="position:absolute;left:80px;right:80px;top:580px">
    <h1 class="titular" style="font-size:80px;color:#fff">Nombre Apellido</h1>
    <p class="texto" style="font-size:38px;color:var(--advance-agua);margin-top:14px">Kinesióloga · Atiende martes y jueves</p>
    <p class="texto" style="font-size:46px;color:#fff;margin-top:40px;font-weight:600">«Me gusta explicar las cosas con calma.»</p>
  </div>
  <div style="position:absolute;left:80px;right:80px;bottom:72px;display:flex;align-items:center;justify-content:space-between">
    <img src="../logo/svg/advance-horizontal-compacto-blanco.svg" alt="Advance" style="width:300px">
    <span style="font-size:32px;font-weight:600;color:var(--advance-agua)">Reserva: +56 9 4293 4776</span>
  </div>

</main>
</body>
</html>
